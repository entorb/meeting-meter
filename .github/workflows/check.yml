---
name: Check Code

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"  # Sunday 05:00 UTC, audit alert
  push:
    branches: ["main", "renovate/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Set timezone to DE
        run: sudo timedatectl set-timezone Europe/Berlin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # for SonarQube

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"

      # - name: Gitleaks
      #   uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
      # - name: Gitleaks Cleanup
      #   run: rm -rf results.sarif

      - name: Run prek pre-commit
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        with:
          extra-args: '--all-files --quiet'

      - name: Run CSpell
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58  # v9.1.0
        with:
          files: '**/*'
          incremental_files_only: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run types

      # - name: Run formatter
      #   run: pnpm run format
      # - name: Setup Biome
      #   uses: biomejs/setup-biome@v2
      #   with:
      #     version: latest

      - name: Run Biome
        run: pnpm exec biome ci .

      - name: Run linter
        run: pnpm run lint

      - name: Run spell checker
        run: pnpm run spell

      - name: Run unit tests
        run: pnpm run test-cov

      - name: Run dead code
        run: pnpm knip

      - name: Run Cypress
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060  # v7
        with:
          # build: pnpx vite build
          # start: pnpx vite preview
          start: pnpm run dev

      # manual run SonarQube to obtain coverage report
      # requires https://sonarcloud.io/project/analysis_method?id=entorb_meeting-meter -> False
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run package audit
        run: pnpm audit --prod
